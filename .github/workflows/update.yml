name: Update Subscription

on:
  schedule:
    # Запуск каждые 6 часов (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:   # ручной запуск
  push:
    branches: [ main ]
    paths:
      - 'SURS.txt'
      - 'IGNOR-name.txt'
      - 'update_subscription.py'

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: pip install requests

      - name: Запуск скрипта обновления
        run: python update_subscription.py

      - name: Коммит и пуш изменений
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "🥷КРОТовые ТОННЕЛИ🥷.txt"
          git commit -m "Автообновление подписки $(date +'%d-%m-%Y %H:%M')" || echo "Нет изменений"
          git push
